"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"956336ab-619f-4cd7-937d-108347d2c34b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  @media print { @page { size: A4; margin: 0; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh; background:#e9eaf0; display:flex; flex-direction:column; align-items:center; gap:30px; padding:46px 16px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:#1a1d2b; -webkit-font-smoothing:antialiased;\">\n\n  <!-- ============ SECTION LABEL: COMPLETA ============ -->\n  <div style=\"width:794px; max-width:100%; display:flex; align-items:center; gap:14px;\">\n    <span style=\"font-size:11px; font-weight:600; letter-spacing:.14em; color:#9aa0b4; text-transform:uppercase;\">Propuesta completa<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 1 — TAPA (PLACEHOLDER) ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; padding:40px;\">\n    <div style=\"position:absolute; inset:26px; border:1.5px dashed #c2c9de; border-radius:8px;\"><\u002Fdiv>\n    <div style=\"position:relative; text-align:center; color:#8a90a6;\">\n      <div style=\"font:500 13px ui-monospace,'SF Mono',monospace; letter-spacing:.04em;\">[ Tapa diseñada externamente — placeholder ]<\u002Fdiv>\n      <div style=\"margin-top:16px; font-size:13px; color:#5a5f72;\">Cliente: <strong style=\"color:#10131f;\">Jose Gonzalez<\u002Fstrong> · El Pinar · 19 de junio de 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 2 — CARTA + HIGHLIGHTS (SIN PRECIO) ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; padding:54px 56px; display:flex; flex-direction:column;\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Carta de presentación<\u002Fdiv>\n    <h2 style=\"margin:10px 0 0; font-size:30px; font-weight:700; letter-spacing:-.02em; color:#10131f;\">Estimado Jose Gonzalez,<\u002Fh2>\n\n    <div style=\"margin-top:18px; display:flex; flex-direction:column; gap:13px; max-width:600px; font-size:13.5px; line-height:1.62; color:#3a3e50;\">\n      <p style=\"margin:0;\">Es un gusto presentarte esta propuesta para la instalación de un sistema solar fotovoltaico en tu hogar de El Pinar. La diseñamos a medida de tu consumo, buscando el mejor equilibrio entre generación, ahorro y retorno de la inversión.<\u002Fp>\n      <p style=\"margin:0;\">El sistema te permite cubrir la mayor parte de tu factura de UTE con energía propia y limpia, con una vida útil estimada de 25 años.<\u002Fp>\n      <p style=\"margin:0;\">En las páginas siguientes encontrás el detalle técnico y económico, los servicios incluidos y los plazos de ejecución. Quedamos a disposición para acompañarte en cada etapa del proceso.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:22px; padding-top:16px; border-top:1px solid #ebedf4;\">\n      <div style=\"font-size:14px; font-weight:700; color:#10131f;\">Nicolás Machín<\u002Fdiv>\n      <div style=\"font-size:12px; color:#7b8198; margin-top:2px;\">Director · Voltia · nmachin@voltia.com.uy<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px; font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Especificaciones del sistema · Lo que vamos a instalar<\u002Fdiv>\n    <div style=\"margin-top:12px;\">\n      <div style=\"display:flex; align-items:center; gap:16px; padding:9px 4px; border-bottom:1px solid #edeff5;\">\n        <div style=\"width:42px; height:42px; flex:none; border-radius:11px; background:#eef1fb; display:flex; align-items:center; justify-content:center; color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"13\" rx=\"1\"><\u002Frect><path d=\"M3 9h18M9 4v13M15 4v13M9 21h6M12 17v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><div style=\"font-size:14px; font-weight:700; color:#10131f;\">Paneles solares<\u002Fdiv><div style=\"font-size:12.5px; color:#6b7188; margin-top:2px;\"><span style=\"color:#9aa0b4;\">Marca:<\u002Fspan> <strong style=\"color:#3a3e50;\">Resun<\u002Fstrong> · 16 unidades · monocristalino de alta eficiencia · 590 W<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:16px; padding:11px 4px; border-bottom:1px solid #edeff5;\">\n        <div style=\"width:42px; height:42px; flex:none; border-radius:11px; background:#eef1fb; display:flex; align-items:center; justify-content:center; color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M8 7h8\"><\u002Fpath><circle cx=\"12\" cy=\"14\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <div><div style=\"font-size:14px; font-weight:700; color:#10131f;\">Inversor<\u002Fdiv><div style=\"font-size:12.5px; color:#6b7188; margin-top:2px;\"><span style=\"color:#9aa0b4;\">Marca:<\u002Fspan> <strong style=\"color:#3a3e50;\">Growatt<\u002Fstrong> · 10 kW · monofásico · conectividad Wifi con reporte en tiempo real<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:16px; padding:9px 4px; border-bottom:1px solid #edeff5;\">\n        <div style=\"width:42px; height:42px; flex:none; border-radius:11px; background:#eef1fb; display:flex; align-items:center; justify-content:center; color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h6l-1 8 9-12h-6z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><div style=\"font-size:14px; font-weight:700; color:#10131f;\">Potencia pico<\u002Fdiv><div style=\"font-size:12.5px; color:#6b7188; margin-top:2px;\">9,44 kWp · máxima generación a pleno sol<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:16px; padding:9px 4px; border-bottom:1px solid #edeff5;\">\n        <div style=\"width:42px; height:42px; flex:none; border-radius:11px; background:#eef1fb; display:flex; align-items:center; justify-content:center; color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><div style=\"font-size:14px; font-weight:700; color:#10131f;\">Superficie ocupada<\u002Fdiv><div style=\"font-size:12.5px; color:#6b7188; margin-top:2px;\">~48 m² sobre techo de tejas (8 × 4 mts) con subestructura<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:16px; padding:9px 4px;\">\n        <div style=\"width:42px; height:42px; flex:none; border-radius:11px; background:#eef1fb; display:flex; align-items:center; justify-content:center; color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div><div style=\"font-size:14px; font-weight:700; color:#10131f;\">Generación anual estimada<\u002Fdiv><div style=\"font-size:12.5px; color:#6b7188; margin-top:2px;\">13.962 kWh / año<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:16px; font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Sobre la instalación<\u002Fdiv>\n    <div style=\"margin-top:12px; display:flex; flex-direction:column; gap:9px; font-size:12px; line-height:1.55; color:#3a3e50;\">\n      <p style=\"margin:0;\">Los paneles se montan sobre el techo disponible con la subestructura adecuada, ocupando ~48 m². La potencia del sistema se define por su potencia pico —la máxima que se genera a pleno sol—, en este caso 9,44 kWp. Los módulos son monocristalinos de alta eficiencia y el inversor reporta la generación en tiempo real por Wifi. Ambos componentes están sujetos a disponibilidad. Los equipos indicados están sujetos a disponibilidad al momento de la instalación; en caso de sustitución, se utilizarán equipos de prestaciones técnicas, calidad y garantías equivalentes o superiores, compatibles con el diseño y con las condiciones económicas acordadas.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:10px; background:#f7f8fc; border:1px solid #ebedf5; border-radius:14px; padding:14px 22px;\">\n      <div style=\"font-size:12.5px; font-weight:700; color:#10131f;\">Protecciones de seguridad incluidas <span style=\"font-weight:400; color:#7b8198;\">— del lado DC y AC, para personas y equipos<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:7px 28px;\">\n        <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:11.5px; color:#3a3e50;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan>Descargador de sobretensión DC<\u002Fdiv>\n        <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:11.5px; color:#3a3e50;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan>Descargador de sobretensión AC<\u002Fdiv>\n        <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:11.5px; color:#3a3e50;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan>Fusibles para sobrecorrientes DC<\u002Fdiv>\n        <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:11.5px; color:#3a3e50;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan>Interruptor termomagnético AC<\u002Fdiv>\n        <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:11.5px; color:#3a3e50;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan>Interruptor diferencial AC (contactos)<\u002Fdiv>\n        <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:11.5px; color:#3a3e50;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan>Puesta a tierra (jabalina) exclusiva, según UTE<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:auto; padding-top:16px; border-top:1px solid #eef0f6; display:flex; align-items:center; justify-content:center;\">\n      <img src=\"d31c2b08-545e-4ae5-a4d4-705cdb2df5d2\" alt=\"Voltia\" style=\"height:40px; width:40px; object-fit:contain; display:block;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 4 — CÓMO FUNCIONA ON-GRID ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; padding:54px 56px; display:flex; flex-direction:column;\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Cómo funciona<\u002Fdiv>\n    <h2 style=\"margin:10px 0 0; font-size:30px; font-weight:700; letter-spacing:-.02em; color:#10131f;\">El sistema on-grid<\u002Fh2>\n\n    <!-- diagrama -->\n    <div style=\"margin-top:22px; background:linear-gradient(180deg,#fbfcfe,#f2f6fc); border:1px solid #e7ecf6; border-radius:18px; padding:20px 24px 22px;\">\n      <div style=\"position:relative; width:612px; height:440px; margin:0 auto;\">\n        <svg width=\"612\" height=\"440\" viewBox=\"0 0 612 440\" fill=\"none\" style=\"position:absolute; inset:0; z-index:0;\">\n          <defs>\n            <marker id=\"dah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"5\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M1.6 1.6 L5.8 4 L1.6 6.4\" fill=\"none\" stroke=\"#aab4cf\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n          <\u002Fdefs>\n          <path d=\"M86 68 V108\" stroke=\"#f0c33c\" stroke-width=\"2\" stroke-dasharray=\"1.5 4\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M128 152 H262\" stroke=\"#c2cbe0\" stroke-width=\"2\" marker-end=\"url(#dah)\"><\u002Fpath>\n          <path d=\"M352 152 H486\" stroke=\"#c2cbe0\" stroke-width=\"2\" marker-end=\"url(#dah)\"><\u002Fpath>\n          <path d=\"M306 200 V225\" stroke=\"#c2cbe0\" stroke-width=\"2\" marker-start=\"url(#dah)\" marker-end=\"url(#dah)\"><\u002Fpath>\n          <path d=\"M306 285 V313\" stroke=\"#c2cbe0\" stroke-width=\"2\" marker-start=\"url(#dah)\" marker-end=\"url(#dah)\"><\u002Fpath>\n          <text x=\"195\" y=\"144\" fill=\"#9aa0b4\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"0.5\" text-anchor=\"middle\" font-family=\"Helvetica,Arial,sans-serif\">DC<\u002Ftext>\n          <text x=\"419\" y=\"144\" fill=\"#9aa0b4\" font-size=\"10.5\" font-weight=\"700\" letter-spacing=\"0.5\" text-anchor=\"middle\" font-family=\"Helvetica,Arial,sans-serif\">AC<\u002Ftext>\n        <\u002Fsvg>\n\n        <div style=\"position:absolute; left:86px; top:46px; transform:translate(-50%,-50%); color:#f0b429; z-index:1;\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n\n        <div style=\"position:absolute; left:86px; top:152px; transform:translate(-50%,-50%); width:78px; height:78px; border-radius:50%; background:#fff; border:1.5px solid #e1e7f2; box-shadow:0 5px 16px rgba(18,42,143,.08); display:flex; align-items:center; justify-content:center; color:#1836B2; z-index:1;\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"12\" rx=\"1\"><\u002Frect><path d=\"M3 9h18M3 13h18M9 5v12M15 5v12\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:absolute; left:86px; top:204px; transform:translateX(-50%); width:150px; text-align:center; z-index:1;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">Paneles solares<\u002Fdiv><div style=\"font-size:10.5px; color:#6b7188; margin-top:3px;\">Corriente continua (DC)<\u002Fdiv><\u002Fdiv>\n\n        <div style=\"position:absolute; left:306px; top:64px; transform:translateX(-50%); width:200px; text-align:center; z-index:1;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">Inversor<\u002Fdiv><div style=\"font-size:10.5px; color:#6b7188; margin-top:3px;\">Convierte DC → AC<\u002Fdiv><\u002Fdiv>\n        <div style=\"position:absolute; left:306px; top:152px; transform:translate(-50%,-50%); width:92px; height:92px; border-radius:50%; background:#1836B2; box-shadow:0 10px 24px rgba(24,54,178,.32); display:flex; align-items:center; justify-content:center; color:#fff; z-index:1;\"><svg width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M7 8h4\"><\u002Fpath><circle cx=\"14.5\" cy=\"14\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n\n        <div style=\"position:absolute; left:526px; top:152px; transform:translate(-50%,-50%); width:78px; height:78px; border-radius:50%; background:#fff; border:1.5px solid #e1e7f2; box-shadow:0 5px 16px rgba(18,42,143,.08); display:flex; align-items:center; justify-content:center; color:#1836B2; z-index:1;\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-7 9 7\"><\u002Fpath><path d=\"M5 10v9h14v-9\"><\u002Fpath><path d=\"M10 19v-5h4v5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:absolute; left:526px; top:204px; transform:translateX(-50%); width:150px; text-align:center; z-index:1;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">Tu casa<\u002Fdiv><div style=\"font-size:10.5px; color:#6b7188; margin-top:3px;\">Autoconsumo<\u002Fdiv><\u002Fdiv>\n\n        <div style=\"position:absolute; left:306px; top:256px; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:#fff; border:1.5px solid #e1e7f2; box-shadow:0 4px 12px rgba(18,42,143,.10); display:flex; align-items:center; justify-content:center; color:#1836B2; z-index:2;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 12l3.5-2\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"1.4\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:absolute; left:348px; top:256px; transform:translateY(-50%); z-index:2;\"><div style=\"font-size:12px; font-weight:700; color:#10131f;\">Medidor bidireccional<\u002Fdiv><div style=\"font-size:10px; color:#6b7188; margin-top:2px;\">Mide lo que entra y lo que se inyecta<\u002Fdiv><\u002Fdiv>\n\n        <div style=\"position:absolute; left:306px; top:356px; transform:translate(-50%,-50%); width:78px; height:78px; border-radius:50%; background:#eef1fb; border:1.5px solid #d9e0f5; display:flex; align-items:center; justify-content:center; color:#1836B2; z-index:1;\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"position:absolute; left:306px; top:408px; transform:translateX(-50%); width:200px; text-align:center; z-index:1;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">Red UTE<\u002Fdiv><div style=\"font-size:10.5px; color:#6b7188; margin-top:3px;\">Compra de excedentes y consumo de energía complementaria<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- explicación -->\n    <div style=\"margin-top:16px; display:flex; flex-direction:column; gap:9px; font-size:12.5px; line-height:1.6; color:#3a3e50;\">\n      <p style=\"margin:0;\">En un sistema <strong style=\"color:#1836B2;\">on-grid<\u002Fstrong>, los paneles convierten la luz del sol en corriente continua (DC) y el inversor la transforma en corriente alterna (AC) apta para el hogar.<\u002Fp>\n      <p style=\"margin:0;\">La energía generada se consume primero en tu casa —autoconsumo, invisible para UTE—. Solo el <strong style=\"color:#1836B2;\">excedente<\u002Fstrong>, cuando los paneles generan más de lo que consumís, sale por el medidor bidireccional de UTE hacia la red y se vende al mismo precio al que UTE vende la energía, descontando IVA y un 12% de IRPF.<\u002Fp>\n      <p style=\"margin:0;\">Cuando los paneles generan menos de lo que necesitás, la energía faltante entra desde la red de UTE pasando también por el medidor. Por eso es bidireccional: registra solo lo que entra y sale de tu instalación hacia la red, nunca el autoconsumo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:10px; display:flex; gap:13px; align-items:flex-start; background:#fff7ed; border:1px solid #f3e2c9; border-radius:12px; padding:13px 18px;\">\n      <div style=\"color:#b9842a; flex:none; margin-top:1px;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8h.01M11 12h1v4h1\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <p style=\"margin:0; font-size:12px; line-height:1.55; color:#5a4a2a;\">Por la carga impositiva sobre la energía vendida, recomendamos revisar los hábitos de consumo para aprovechar localmente la mayor parte de la energía generada y no perder valor sobre los excedentes.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:10px; display:flex; gap:13px; align-items:flex-start; background:#fff7ed; border:1px solid #f3e2c9; border-radius:12px; padding:13px 18px;\">\n      <div style=\"color:#b9842a; flex:none; margin-top:1px;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 2 21h20L12 2z\"><\u002Fpath><path d=\"M12 9v5M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div>\n        <div style=\"font-size:12.5px; font-weight:700; color:#5a4a2a;\">Importante — durante un corte de UTE<\u002Fdiv>\n        <p style=\"margin:5px 0 0; font-size:12px; line-height:1.55; color:#5a4a2a;\">El sistema on-grid base no dispone de respaldo ante cortes de la red eléctrica. Por seguridad, el inversor se desconecta automáticamente cuando UTE queda fuera de servicio. Si necesitás continuidad de energía durante cortes, podemos incorporar baterías de respaldo como ítem adicional (ver Variante B en la cotización).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:auto; padding-top:16px; border-top:1px solid #eef0f6; display:flex; align-items:center; justify-content:center;\">\n      <img src=\"d31c2b08-545e-4ae5-a4d4-705cdb2df5d2\" alt=\"Voltia\" style=\"height:40px; width:40px; object-fit:contain; display:block;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 5 — SERVICIOS INCLUIDOS + NO INCLUIDOS ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; padding:54px 56px; display:flex; flex-direction:column;\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Servicio llave en mano<\u002Fdiv>\n    <h2 style=\"margin:10px 0 0; font-size:30px; font-weight:700; letter-spacing:-.02em; color:#10131f;\">Todo lo que incluye<\u002Fh2>\n\n    <div style=\"margin-top:24px; display:grid; grid-template-columns:repeat(3,1fr); gap:13px;\">\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3-3\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Preventa<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Acompañamiento, relevamiento y asesoramiento técnico en la etapa previa a la venta del servicio.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19l7-7-3-3-7 7v3z\"><\u002Fpath><path d=\"M15 6l3 3\"><\u002Fpath><path d=\"M3 21h7\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Ingeniería<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Estudio y diseño de la solución para cumplir las normativas técnicas y de seguridad. Incluye memoria descriptiva y planos estructurales y eléctricos.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 8l-9-5-9 5 9 5 9-5z\"><\u002Fpath><path d=\"M3 8v8l9 5 9-5V8\"><\u002Fpath><path d=\"M12 13v8\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Materiales<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Suministro de todos los insumos: paneles, inversor, estructura de montaje, cableados, protecciones, tableros y puesta a tierra exclusiva.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Planificación<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Logística y traslado de materiales, recursos humanos, herramientas y equipamiento hasta el lugar de trabajo.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 7l3 3-9 9-4 1 1-4 9-9z\"><\u002Fpath><path d=\"M14 7l3-3 3 3-3 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Montaje<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Montaje e instalación de estructuras, paneles, cableado, canalizaciones, tableros, inversor y protecciones.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a10 10 0 1 0 10 10\"><\u002Fpath><path d=\"M12 8v4l3 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Puesta en marcha<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Puesta en funcionamiento del sistema conectado a la red, realizando todas las pruebas exigidas por UTE.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"m9 14 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Tramitación UTE<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Todos los trámites frente a UTE para la aprobación del proyecto y su habilitación, mediante firma autorizada Categoría A de Voltia.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.7 2.7-1.4-1.4 2.1-2.9z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Mantenimiento<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">Mantenimiento periódico cada 1 año durante los primeros 2 años posteriores a la instalación, sin cargo extra.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:13px; padding:16px 15px;\"><div style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-size:13.5px; font-weight:700; color:#10131f; margin-top:10px;\">Garantía<\u002Fdiv><div style=\"font-size:10.5px; line-height:1.45; color:#6b7188; margin-top:5px;\">10 / 5 / 3 años. Ver el detalle en la sección Garantías.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:24px; display:flex; gap:14px; align-items:flex-start; border:1px solid #ecdede; background:#fbf6f6; border-radius:13px; padding:18px 20px;\">\n      <div style=\"color:#a85a5a; flex:none; margin-top:1px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15 9l-6 6M9 9l6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div>\n        <div style=\"font-size:13.5px; font-weight:700; color:#10131f;\">Servicios no incluidos<\u002Fdiv>\n        <p style=\"margin:6px 0 0; font-size:11.5px; line-height:1.55; color:#5a5f72;\">No incluye ningún costo que generes frente a UTE, ni obras civiles excepcionales que se requieran y no estén mencionadas en el alcance de esta propuesta (por ejemplo: nichos, columnas, canaletas, etc.).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:auto; padding-top:16px; border-top:1px solid #eef0f6; display:flex; align-items:center; justify-content:center;\">\n      <img src=\"d31c2b08-545e-4ae5-a4d4-705cdb2df5d2\" alt=\"Voltia\" style=\"height:40px; width:40px; object-fit:contain; display:block;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE — GARANTÍAS ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; padding:54px 56px; display:flex; flex-direction:column;\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Garantías<\u002Fdiv>\n    <h2 style=\"margin:10px 0 0; font-size:30px; font-weight:700; letter-spacing:-.02em; color:#10131f;\">Tu inversión, respaldada<\u002Fh2>\n\n    <div style=\"margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:16px;\">\n      <div style=\"border:1px solid #e9ebf3; border-radius:14px; padding:22px 24px;\">\n        <div style=\"display:flex; align-items:center; gap:11px;\"><span style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5z\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font-size:15px; font-weight:700; color:#10131f;\">Garantía del fabricante<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:14px; display:flex; flex-direction:column; gap:11px;\">\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan><div style=\"font-size:12px; line-height:1.5; color:#3a3e50;\"><strong style=\"color:#10131f;\">Paneles solares: 10 años<\u002Fstrong> contra defectos de fabricación. La garantía del fabricante se traslada directamente al cliente final, gestionada vía Voltia.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan><div style=\"font-size:12px; line-height:1.5; color:#3a3e50;\"><strong style=\"color:#10131f;\">Inversor: 5 años<\u002Fstrong> contra defectos de fabricación.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan><div style=\"font-size:12px; line-height:1.5; color:#3a3e50;\"><strong style=\"color:#10131f;\">Otros componentes<\u002Fstrong> (estructura, protecciones): <strong style=\"color:#10131f;\">5 años<\u002Fstrong> contra defectos de fabricación.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:14px; padding:22px 24px;\">\n        <div style=\"display:flex; align-items:center; gap:11px;\"><span style=\"color:#1836B2;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font-size:15px; font-weight:700; color:#10131f;\">Garantía de Voltia<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:14px; display:flex; gap:10px; align-items:flex-start;\"><span style=\"color:#1836B2; flex:none; margin-top:1px;\">●<\u002Fspan><div style=\"font-size:12px; line-height:1.5; color:#3a3e50;\"><strong style=\"color:#10131f;\">3 años<\u002Fstrong> contra errores humanos durante la instalación o la tramitación frente a UTE.<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:18px; padding-top:16px; border-top:1px solid #eef0f6; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#1836B2;\">Gestión de reclamos<\u002Fdiv>\n        <p style=\"margin:8px 0 0; font-size:12px; line-height:1.5; color:#3a3e50;\">Voltia acompaña al cliente en la gestión de reclamos relacionados directamente con los equipos instalados, la instalación fotovoltaica o el trámite de habilitación realizado por Voltia.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px;\">\n      <div style=\"border:1px solid #d9e8de; background:#f4faf6; border-radius:14px; padding:22px 24px;\">\n        <div style=\"font-size:13px; font-weight:700; color:#1f7a4d;\">Qué incluye la garantía<\u002Fdiv>\n        <div style=\"margin-top:12px; display:flex; flex-direction:column; gap:9px;\">\n          <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:12px; color:#3a3e50;\"><span style=\"color:#1f8a5b; flex:none; margin-top:2px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Reposición o reparación del equipo defectuoso.<\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:12px; color:#3a3e50;\"><span style=\"color:#1f8a5b; flex:none; margin-top:2px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Mano de obra de retiro y reinstalación.<\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:12px; color:#3a3e50;\"><span style=\"color:#1f8a5b; flex:none; margin-top:2px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Traslado de los equipos al taller del fabricante si corresponde.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #ecdede; background:#fbf6f6; border-radius:14px; padding:22px 24px;\">\n        <div style=\"font-size:13px; font-weight:700; color:#a85a5a;\">Qué no incluye<\u002Fdiv>\n        <div style=\"margin-top:12px; display:flex; flex-direction:column; gap:9px;\">\n          <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:12px; color:#3a3e50;\"><span style=\"color:#c07a7a; flex:none; margin-top:1px;\">●<\u002Fspan>Daños por mal uso o intervención de terceros sobre la instalación.<\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:12px; color:#3a3e50;\"><span style=\"color:#c07a7a; flex:none; margin-top:1px;\">●<\u002Fspan>Fenómenos climáticos extremos: granizo*, rayos directos, vientos huracanados.<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0; font-size:11px; line-height:1.5; color:#8a6a6a;\">* El seguro contra granizo opcional cubre estos eventos (ver Financiación y protección adicional).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:auto; padding-top:16px; border-top:1px solid #eef0f6; display:flex; align-items:center; justify-content:center;\">\n      <img src=\"d31c2b08-545e-4ae5-a4d4-705cdb2df5d2\" alt=\"Voltia\" style=\"height:40px; width:40px; object-fit:contain; display:block;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 6 — PLAZO DE ENTREGA ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; padding:54px 56px; display:flex; flex-direction:column;\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Plazo de entrega<\u002Fdiv>\n    <h2 style=\"margin:10px 0 0; font-size:30px; font-weight:700; letter-spacing:-.02em; color:#10131f;\">Cómo es el proceso, paso a paso<\u002Fh2>\n    <p style=\"margin:16px 0 0; font-size:13px; line-height:1.6; color:#4a4f63; max-width:620px;\">Desde la firma del contrato hasta la habilitación final hay varias etapas. Entre la firma y la instalación existe un período de coordinación previa que no es inmediato: agenda de obra, gestiones administrativas y aprobaciones. Estos son los plazos de referencia.<\u002Fp>\n\n    <div style=\"margin-top:40px; position:relative;\">\n      <div style=\"position:absolute; left:11%; right:11%; top:10px; height:2px; background:#dde1ee;\"><\u002Fdiv>\n      <div style=\"display:flex; justify-content:space-between; position:relative;\">\n        <div style=\"display:flex; flex-direction:column; align-items:center; width:22%;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#1836B2; border:3px solid #fff; box-shadow:0 0 0 2px #1836B2;\"><\u002Fdiv><div style=\"font-size:13px; font-weight:700; color:#10131f; margin-top:16px; text-align:center;\">Firma de contrato<\u002Fdiv><div style=\"font-size:11px; color:#6b7188; margin-top:3px; text-align:center;\">y 50% de pago inicial<\u002Fdiv><div style=\"font-size:11px; font-weight:700; color:#1836B2; margin-top:8px;\">Día 0<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; align-items:center; width:22%;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#1836B2; border:3px solid #fff; box-shadow:0 0 0 2px #1836B2;\"><\u002Fdiv><div style=\"font-size:13px; font-weight:700; color:#10131f; margin-top:16px; text-align:center;\">Coordinación previa<\u002Fdiv><div style=\"font-size:11px; color:#6b7188; margin-top:3px; text-align:center;\">agenda, gestiones y acopio<\u002Fdiv><div style=\"font-size:11px; font-weight:700; color:#1836B2; margin-top:8px;\">3 a 4 semanas<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; align-items:center; width:22%;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#1836B2; border:3px solid #fff; box-shadow:0 0 0 2px #1836B2;\"><\u002Fdiv><div style=\"font-size:13px; font-weight:700; color:#10131f; margin-top:16px; text-align:center;\">Instalación física<\u002Fdiv><div style=\"font-size:11px; color:#6b7188; margin-top:3px; text-align:center;\">montaje sobre el techo<\u002Fdiv><div style=\"font-size:11px; font-weight:700; color:#1836B2; margin-top:8px;\">3 días<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; align-items:center; width:22%;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #1836B2; box-shadow:0 0 0 2px #1836B2;\"><\u002Fdiv><div style=\"font-size:13px; font-weight:700; color:#10131f; margin-top:16px; text-align:center;\">Habilitación UTE<\u002Fdiv><div style=\"font-size:11px; color:#6b7188; margin-top:3px; text-align:center;\">y puesta en marcha<\u002Fdiv><div style=\"font-size:11px; font-weight:700; color:#1836B2; margin-top:8px;\">hasta 8 semanas<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:46px; font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Qué pasa en cada etapa<\u002Fdiv>\n    <div style=\"margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n      <div style=\"border:1px solid #e9ebf3; border-radius:12px; padding:16px 18px;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">1 · Firma y pago inicial<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.5; color:#6b7188; margin-top:5px;\">Se confirma el proyecto, se firma el contrato y se abona el 50% del total para iniciar.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:12px; padding:16px 18px;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">2 · Coordinación previa<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.5; color:#6b7188; margin-top:5px;\">Agenda de la obra, gestiones administrativas, aprobaciones y acopio de los materiales. No es instantáneo.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:12px; padding:16px 18px;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">3 · Instalación física<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.5; color:#6b7188; margin-top:5px;\">Montaje de estructura, paneles, inversor y protecciones sobre el techo, en pocos días de trabajo.<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #e9ebf3; border-radius:12px; padding:16px 18px;\"><div style=\"font-size:13px; font-weight:700; color:#10131f;\">4 · Habilitación UTE<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.5; color:#6b7188; margin-top:5px;\">Trámite de conexión y puesta en marcha frente a UTE, que puede demorar luego de finalizada la instalación.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:18px 0 0; font-size:10.5px; color:#9aa0b4; line-height:1.5;\">Los plazos son estimados y de referencia; pueden variar según la agenda de obra y los tiempos de gestión frente a UTE.<\u002Fp>\n\n    <div style=\"margin-top:auto; padding-top:16px; border-top:1px solid #eef0f6; display:flex; align-items:center; justify-content:center;\">\n      <img src=\"d31c2b08-545e-4ae5-a4d4-705cdb2df5d2\" alt=\"Voltia\" style=\"height:40px; width:40px; object-fit:contain; display:block;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PAGE 7 — GENERACIÓN + AHORRO COMPACTO ============ -->\n  <div style=\"width:794px; height:1123px; background:#fff; box-shadow:0 6px 30px rgba(18,42,143,.13); position:relative; overflow:hidden; flex:none; padding:54px 56px; display:flex; flex-direction:column;\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Generación de energía<\u002Fdiv>\n    <h2 style=\"margin:10px 0 0; font-size:30px; font-weight:700; letter-spacing:-.02em; color:#10131f;\">Generación mensual estimada<\u002Fh2>\n\n    <div style=\"margin-top:32px; display:flex; align-items:flex-end; gap:9px; height:248px;\">\n      <sc-for list=\"{{ genChart }}\" as=\"bar\" hint-placeholder-count=\"12\">\n        <div style=\"flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px;\">\n          <span style=\"font-size:9.5px; font-weight:700; color:#1836B2;\">{{ bar.label }}<\u002Fspan>\n          <div style=\"width:72%; border-radius:4px 4px 0 0; background:#1836B2; height:{{ bar.h }}%;\"><\u002Fdiv>\n          <span style=\"font-size:10.5px; color:#8a90a6;\">{{ bar.m }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:10px; font-size:11px; color:#9aa0b4; text-align:right;\">kWh por mes<\u002Fdiv>\n\n    <p style=\"margin:22px 0 0; font-size:13px; line-height:1.62; color:#4a4f63; max-width:660px;\">La generación varía a lo largo del año según la estación. Es mayor en los meses de verano, con más horas de sol, y desciende en invierno. En el balance anual el sistema produce <strong style=\"color:#1836B2;\">13.962 kWh / año<\u002Fstrong>, suficiente para cubrir la mayor parte de tu consumo. En el balance económico anual, los mayores ingresos y ahorros de los meses soleados compensan parcialmente los meses de menor generación.<\u002Fp>\n\n    <div style=\"margin-top:30px; font-size:11px; font-weight:700; letter-spacing:.14em; color:#1836B2; text-transform:uppercase;\">Tu ahorro<\u002Fdiv>\n    <div style=\"margin-top:16px; background:#1836B2; border-radius:16px; padding:24px 30px; color:#fff; display:flex; align-items:center; gap:26px;\">\n      <div style=\"flex:none;\">\n        <div style=\"font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#aebcf2;\">Tu factura hoy<\u002Fdiv>\n        <div style=\"font-size:26px; font-weight:700; margin-top:5px;\">$ 9.000<\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#aebcf2;\">por mes<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"color:#9fb0ef; flex:none;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"flex:none;\">\n        <div style=\"font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#aebcf2;\">Con Voltia<\u002Fdiv>\n        <div style=\"font-size:26px; font-weight:700; margin-top:5px;\">$ 976<\u002Fdiv>\n        <div style=\"font-size:10.5px; color:#aebcf2;\">por mes · −89%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px; align-self:stretch; background:rgba(255,255,255,.2); margin:0 4px;\"><\u002Fdiv>\n      <div style=\"flex:1;\">\n        <div style=\"font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#cdd6f7;\">Ahorrás<\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:4px;\">\n          <span style=\"font-size:44px; font-weight:700; letter-spacing:-.02em; line-height:1;\">$ 8.024<\u002Fspan>\n          <span style=\"font-size:15px; color:#cdd6f7;\">/ mes<\u002Fspan>\n          <span style=\"font-size:15px; color:#cdd6f7;\">· USD 2.407 / año<\u002Fspan>\n        <\u002Fd
