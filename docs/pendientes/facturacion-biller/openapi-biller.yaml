  /v3/comprobantes/notificaciones/obtener:
    get:
      tags:
      - Comprobantes
      summary: Obtener notificaciones
      description: |-
        <span style="color:#0082d0;font-weight:600;font-family:monospace">GET</span> <code>/v3/comprobantes/notificaciones/obtener</code>

        Las notificaciones son los envíos por email del PDF de un comprobante a sus destinatarios (por ejemplo, al cliente o a las direcciones indicadas en `emails_notificacion` al emitir). Cada notificación tiene un estado: `PENDIENTE` (creada, aún no enviada), `ENVIADA` (entregada) o `ERROR` (falló el envío).

        Este endpoint devuelve las notificaciones de un comprobante puntual. Sólo se incluyen las que están en estado `PENDIENTE` o `ENVIADA` — las que fallaron (`ERROR`) no se muestran acá.

        El comprobante a consultar se indica de una de estas dos formas: por su `id`, o por la combinación de `tipo_comprobante`, `serie` y `numero`. Sólo se puede usar una de las dos.

        Si el comprobante no tiene notificaciones asociadas, la respuesta es un array vacío (`[]`).
      security:
      - bearerAuth: []
      x-codeSamples:
      - lang: shell
        label: Shell Curl
        source: |-
          curl 'https://test.biller.uy/v3/comprobantes/notificaciones/obtener?tipo_comprobante=111&serie=C&numero=4266' \
            --header 'Content-Type: application/json' \
            --header 'Authorization: Bearer YOUR_SECRET_TOKEN'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: id
        in: query
        schema:
          type: integer
          minimum: 1
        description: Id del comprobante. Obligatorio si no se envían tipo_comprobante, serie y numero.
      - name: tipo_comprobante
        in: query
        schema:
          type: integer
          minimum: 1
        description: Tipo del comprobante. Obligatorio junto con serie y numero.
        example: 111
      - name: serie
        in: query
        schema:
          type: string
          maxLength: 2
        description: Serie del comprobante. Obligatorio junto con tipo_comprobante y numero.
        example: C
      - name: numero
        in: query
        schema:
          type: integer
          minimum: 1
        description: Número del comprobante. Obligatorio junto con tipo_comprobante y serie.
        example: 4266
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
              example:
              - email: enviada@dominio.com
                estado: ENVIADA
                fecha_envio: '2018-02-02 10:16:22'
              - email: pendiente@dominio.com
                estado: PENDIENTE
                fecha_envio: null
        '422':
          description: 'Unprocessable Entity — error de validación en los datos enviados. Otros mensajes
            posibles: "Id no puede estar vacío si no se indica tipo, serie y número.", "No se puede pasar
            id y tipo, serie y número al mismo tiempo."'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: Campo que falló la validación.
                    message:
                      type: string
                      description: Mensaje de error asociado al campo.
              example:
              - field: id
                message: Comprobante 999999 no existe o no tiene acceso.
        '405':
          description: Method Not Allowed — el endpoint sólo admite GET.
  /v3/comprobantes/notificaciones/enviar:
    post:
      tags:
      - Comprobantes
      summary: Enviar notificaciones
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v3/comprobantes/notificaciones/enviar</code>

        Las notificaciones son los envíos por email del PDF de un comprobante a sus destinatarios (por ejemplo, al cliente o a las direcciones indicadas en `emails_notificacion` al emitir). Cada notificación tiene un estado: `PENDIENTE` (creada, aún no enviada), `ENVIADA` (entregada) o `ERROR` (falló el envío).

        Este endpoint crea una notificación en estado `PENDIENTE` para cada email indicado. El envío real del email es asíncrono, no ocurre en el momento de esta llamada.

        El comprobante a notificar se indica de una de estas dos formas: por su `id`, o por la combinación de `tipo_comprobante`, `serie` y `numero`. Sólo se puede usar una de las dos.

        La validación de `emails` es todo-o-nada: si alguno de los emails no es válido, no se crea ninguna notificación.
        Requiere que la empresa esté verificada. una empresa "verificada" es una empresa que ya terminó el proceso de habilitación como emisor electrónico (no está en trial/pendiente de alta), y por eso recién ahí se le permite emitir/notificar comprobantes reales.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - emails
              properties:
                id:
                  type: integer
                  minimum: 1
                  description: Id del comprobante. Obligatorio si no se envían tipo_comprobante, serie
                    y numero.
                  example: 1
                tipo_comprobante:
                  type: integer
                  minimum: 1
                  description: Tipo del comprobante. Obligatorio junto con serie y numero.
                  example: 111
                serie:
                  type: string
                  maxLength: 2
                  description: Serie del comprobante. Obligatorio junto con tipo_comprobante y numero.
                  example: C
                numero:
                  type: integer
                  minimum: 1
                  description: Número del comprobante. Obligatorio junto con tipo_comprobante y serie.
                  example: 4266
                emails:
                  type: array
                  items:
                    type: string
                  description: Emails a los que se enviará la notificación. No puede estar vacío, máximo
                    10, cada uno validado por formato y DNS.
                  example:
                  - uno@biller.uy
                  - dos@biller.uy
            examples:
              00-enviar-con-id:
                summary: Enviar con ID
                value:
                  id: 1
                  emails:
                  - uno@biller.uy
                  - dos@biller.uy
              01-enviar-con-tipo-comprobante-serie-y-numero:
                summary: Enviar con tipo comprobante, serie y número
                value:
                  tipo_comprobante: 111
                  serie: C
                  numero: 4266
                  emails:
                  - receptor@biller.uy
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
              examples:
                example-0:
                  summary: Enviar con ID
                  value:
                  - id: 101
                    comprobante: 1
                    email: uno@biller.uy
                    estado: PENDIENTE
                  - id: 102
                    comprobante: 1
                    email: dos@biller.uy
                    estado: PENDIENTE
                example-1:
                  summary: Enviar con tipo comprobante, serie y número
                  value:
                  - id: 103
                    comprobante: 1
                    email: receptor@biller.uy
                    estado: PENDIENTE
        '422':
          description: 'Unprocessable Entity — error de validación en los datos enviados. Otros mensajes
            posibles: "Emails no puede estar vacío.", comprobante no encontrado ("Comprobante 999999 no
            existe o no tiene acceso."), o error de exclusividad entre id y tipo, serie y número.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: Campo que falló la validación.
                    message:
                      type: string
                      description: Mensaje de error asociado al campo.
              example:
              - field: emails
                message: No se pueden enviar más de 10 emails a la vez.
        '403':
          description: Forbidden — la empresa no se encuentra verificada.
          content:
            application/json:
              schema:
                type: object
              example:
                name: Forbidden
                message: La empresa no se encuentra verificada.
                code: 0
                status: 403
        '405':
          description: Method Not Allowed — el endpoint sólo admite POST.
