tags:
- name: Primeros pasos
  description: |-
    Comenzá a integrar con Biller en minutos siguiendo estos pasos:

    1. Registrar un usuario en [test.biller.uy](https://test.biller.uy).

    2. Ingresar con el usuario creado y registrar una empresa en forma de prueba.

    3. Obtener el ID de la sucursal — se encuentra en **Ajustes / Sucursales**.

    4. Obtener el token de la empresa en `{ambiente}.biller.uy/api/tokens`. Más información en la sección [Autenticación](#tag/Autenticación).

    5. Emitir un e-Ticket de prueba usando el cliente integrado en esta documentación — cada endpoint tiene un botón **Test Request** con ejemplos precargados.
- name: Ambientes y URL
  description: |-
    ## Ambientes

    Existen dos ambientes para operar en Biller: **testing** y **producción**. Están completamente separados — la creación de una cuenta en uno no implica disponibilidad en el otro.

    Cada ambiente utiliza su homólogo en DGI, por lo que cualquier comprobante emitido en Biller será enviado al ambiente correspondiente en DGI.

    | Ambiente | URL base |
    | --- | --- |
    | Testing | `https://test.biller.uy` |
    | Producción | `https://biller.uy` |

    ## URL

    La URL para interactuar con Biller tiene la forma:

    ```
    https://{ambiente}.biller.uy/{versión}/{llamado}?{parámetros}
    ```

    Por ejemplo, emisión de comprobantes en ambiente de test usando la v3:

    ```
    POST https://test.biller.uy/v3/comprobantes/emitir
    ```

    ## Versionado

    La API mantiene dos versiones activas: **v2** y **v3**. La mayoría de los endpoints se encuentran en v2; los nuevos desarrollos se incorporan en v3.

    Las nuevas versiones introducen cambios incompatibles con las anteriores para no afectar integraciones existentes. La versión debe especificarse en la URL de cada solicitud.
- name: Autenticación
  description: |-
    ## Bearer Token

    Todos los llamados requieren autenticación mediante Bearer Token. Cada token está asociado unívocamente a una empresa.

    **Para obtener un token:**
    1. Crear un usuario en el sistema
    2. Crear una empresa
    3. Generar el token en `{ambiente}.biller.uy/api/tokens`

    | Ambiente | URL de tokens |
    | --- | --- |
    | Testing | `https://test.biller.uy/api/tokens` |
    | Producción | `https://biller.uy/api/tokens` |

    **Encabezados requeridos en cada solicitud:**

    ```
    Authorization: Bearer su-token-aqui
    Content-Type: application/json
    ```

    ## Rate limiting

    | Operación | Límite |
    | --- | --- |
    | Creación de comprobantes y consultas a DGI | 1 llamado/segundo por token |
    | Resto de operaciones | 30 llamados/segundo por token |
- name: Códigos de error
  description: |-
    ## Códigos de respuesta HTTP

    <table><thead><tr><th style="white-space:nowrap">Nro</th><th style="white-space:nowrap">Estado</th><th>Descripción</th></tr></thead><tbody><tr><td style="white-space:nowrap">400</td><td style="white-space:nowrap">Bad Request</td><td>La solicitud contiene sintaxis errónea, no debería repetirse.</td></tr><tr><td style="white-space:nowrap">403</td><td style="white-space:nowrap">Forbidden</td><td>No tiene los privilegios para hacer la solicitud realizada.</td></tr><tr><td style="white-space:nowrap">404</td><td style="white-space:nowrap">Not Found</td><td>Página o recurso no encontrado.</td></tr><tr><td style="white-space:nowrap">422</td><td style="white-space:nowrap">Unprocessable Entity</td><td>La solicitud es sintácticamente correcta, pero contiene errores en los datos.</td></tr><tr><td style="white-space:nowrap">429</td><td style="white-space:nowrap">Too Many Requests</td><td>Se realizaron más solicitudes que las permitidas. Reintentar en unos segundos.</td></tr><tr><td style="white-space:nowrap">500</td><td style="white-space:nowrap">Internal Server Error</td><td>Error interno del servidor.</td></tr></tbody></table>
- name: Comprobantes
  description: Endpoints para emitir, anular y consultar Comprobantes Fiscales Electrónicos (CFEs).
- name: Recibos
  description: Endpoints para emitir y cancelar recibos asociados a comprobantes.
- name: Pagos
  description: Endpoints para registrar pagos asociados a comprobantes.
- name: Clientes
  description: Endpoints para gestionar clientes en Biller.
- name: Productos
  description: Endpoints para cargar productos y servicios al catálogo de la empresa.
- name: Servicios DGI
  description: |-
    # Servicios web de DGI

    ¡Bienvenido a la API de comunicación con DGI brindada por Biller!

    Mediante esta API vas a poder consumir los siguientes servicios web que brinda la DGI:

    - Servicio de Certificado Único
    - Servicio de Registro: Datos de entidad
    - Servicio de Registro: Nombre de la entidad
    - Servicio de Registro: Actividad empresarial

    Para usar esta API es necesario ser usuario de Biller y pertenecer al plan que incluye el uso de APIs.

    Al hacer uso de la API se utiliza el certificado digital de la empresa logueada para establecer la
    comunicacion con DGI.

    ## La API expone los siguientes endpoints:
