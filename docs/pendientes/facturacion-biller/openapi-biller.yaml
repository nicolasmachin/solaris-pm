      summary: Emisión de CFEs
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v3/comprobantes/emitir</code>

        # Tabla de valores:

        <details open>
        <summary>Tabla de valores:</summary>

        | Clave | Valor | Detalle |
        | --- | --- | --- |
        | tipo_comprobante | entero | 101 - e-Ticket  <br>102 - Nota de crédito de e-Ticket  <br>103 - Nota de débito de e-Ticket  <br>  <br>111 - e-Factura  <br>112 - Nota de crédito de e-Factura  <br>113 - Nota de débito de e-Factura  <br>  <br>121 - e-Factura de exportación  <br>122 - Nota de crédito de e-Factura de exportación  <br>123 - Nota de débito de e-Factura de exportación  <br>  <br>124 - eRemito de exportación  <br>  <br>131 - e-Ticket Venta por cuenta ajena  <br>132 - NC e-Ticket Venta por cuenta ajena  <br>133 - ND e-Ticket venta por cuenta ajena  <br>  <br>141 - e-Factura Venta por cuenta ajena  <br>142 - NC e-Factura Venta por cuenta ajena  <br>143 - ND e-Factura venta por cuenta ajena  <br>  <br>151 - eBoleta de entrada  <br>152 - NC eBoleta de entrada  <br>153 - ND eBoleta de entrada  <br>  <br>181 - eRemito  <br>182 - eResguardo |
        | numero_interno | string | Número interno que referencia al comprobante  <br>**El número debería ser único y no utilizado en el ambiente de test** |
        | forma_pago | entero | 1 - contado  <br>2 - crédito |
        | fecha_emision | string | Formato dd/mm/aaaa  <br>**Mínimo 01/10/2011  <br>Máximo dos meses a futuro** |
        | fecha_vencimiento | string | Formato dd/mm/aaaa |
        | sucursal | entero | ID de sucursal de la empresa en Biller.  <br>Obtener de test o producción. |
        | moneda | string | UYU  <br>USD  <br>ARS  <br>BRL  <br>EUR  <br>... |
        | tasa_cambio | float | Si el campo no se incluye se obtiene de la fecha de cierre anterior a fecha_emision. Si se incluye se toma el valor enviado |
        | montos_brutos | booleano | **True o 1**, indica que los precios de los ítems ya incluyen IVA.  <br>**False, 0** o si no se envía el campo, se calculará el IVA correspondiente y se sumará al total. |
        | numero_compra | string (50) | Número de orden del CFE que se emite. |
        | lugar_entrega | string |  |
        | **cliente** | objeto | Ver sección [cliente](#cliente) |
        | **items** | array de objetos | Ver sección [detalle de ítems](#detalle_items) |
        | **descuentosRecargos** | array de objetos | Ver sección [descuentos y recargos globales](#descuentos_recargos) |
        | referencia_global | booleano | (Para notas ajuste)  <br>Indica si se utiliza una referencia global o no.  <br>**Mutuamente excluyente con referencias** |
        | razon_referencia | string | (Para notas ajuste)  <br>Detalle de razón de referencia. A utilizar por ejemplo en caso de tener que anular comprobantes tradicionales.  <br>**Obligatorio en caso de tener referencia_global** |
        | **referencias** | string | Ver sección [referencia](#referencia)  <br>**Mutuamente excluyente con referencia_global** |
        | tipo_traslado | entero | **Obligatorio para remitos  <br>**1: Venta  <br>2: Traslados internos |
        | adenda | string | Cadena a enviar al cliente en la adenda y a mostrar en el PDF. |
        | informacion_adicional | string (150) |  |
        | modalidad_venta | entero | **Obligatorio sólo en exportaciones**  <br>1 - Régimen General  <br>2 - Consignación  <br>3 - Precio Revisable  <br>4 - Bienes propios a exclaves aduaneros  <br>80 - Régimen TAX FREE  <br>90 - Régimen general - exportación de servicios  <br>99 - Otras transacciones |
        | clausula_venta | string (3) | **Obligatorio sólo en exportaciones**  <br>"CFR" - CFR: Cost and Freight"  <br>"CIF" - CIF: Cost, Insurance and Freight  <br>"CIP" - CIP: Carriage And Insurance Paid To  <br>"CPT" - CPT: Carriage Paid To  <br>"DAP" - DAP: Delivered At Place  <br>"DAT" - DAT: Delivered At Terminal  <br>"DDP" - DDP: Delivered Duty Paid  <br>"DDU" - DDU: Delivered Duty Unpaid  <br>"EXW" - EXW: Ex Works  <br>"FAS" - FAS: Free Alongside Ship  <br>"FCA" - FCA: Free Carrier  <br>"FOB" - FOB: Free On Board  <br>"N/A" - N/A No aplica |
        | via_transporte | entero | **Obligatorio sólo en exportaciones**  <br>1 - Marítimo  <br>2 - Aéreo  <br>3 - Terrestre  <br>8 - N/A  <br>9 - Otro |
        | indicador_pagos_terceros | booleano | En caso de no enviarse se toma por defecto False |
        | emails_notificacion | array de string | Emails a dónde se enviará el PDF del Comprobante (se suman a los emails definidos en cliente_sucursal) |

        </details>


