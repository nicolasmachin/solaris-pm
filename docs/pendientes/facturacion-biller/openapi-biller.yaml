                      pais: UY
                  pago:
                    fecha: '2021-05-27'
                    monto: 1800
                    referencia: Transferencia Itaú 2111
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Recibo de e-Factura
                  value:
                    id: 79890
                    serie: C
                    numero: '2641500'
                    hash: XnRfCq0xILn5O0ykjeqq35rpvOA=
                example-1:
                  summary: Recibo de e-Ticket
                  value:
                    id: 281867
                    serie: MT
                    numero: 13315
                    hash: /brdoQxwbwHiIeDW4+yRjf1eJkQ=
                example-2:
                  summary: Recibo de e-Factura con saldo sin asociar
                  value:
                    id: 39945
                    serie: D
                    numero: '132500'
                    hash: XnRfCJLSADJasdjhAS890OA=
                example-3:
