        ### <a id="detalle_items"></a>Detalle de ítems

        <details open>
        <summary>Detalle de ítems</summary>

        | Clave | Valor | Detalle |
        | --- | --- | --- |
        | codigo | string (35) |  |
        | cantidad | float (3 decimales) |  |
        | concepto | string (80) |  |
        | precio | float (6 decimales) |  |
        | unidad_medida | string (4) |  |
        | codigo_ean | entero (13) |  |
        | codigo_dun | entero (14) |  |
        | codigo_gtin_13 | string (13) | Solo dígitos numéricos. |
        | ncm | string (20) | **Obligatorio sólo en exportaciones.** Código de posición arancelaria. |
        | indicador_facturacion | entero | 1 - Exento de IVA  <br>2 - Tasa mínima  <br>3 - Tasa básica  <br>4 - Otra tasa  <br>5 - Entrega gratuita  <br>6 - Producto o servicio no facturable  <br>7 - Producto o servicio no facturable negativo  <br>8 - Ítem a rebajar en e-remitos y en e-remitos de exportación  <br>9 - Ítem a anular en resguardos  <br>10 - Exportación y asimiladas  <br>11 - Impuesto percibido  <br>12 - IVA en suspenso  <br>13 - Ítem vendido no contribuyente  <br>14 - Ítem vendido contribuyente monotributo  <br>15 - Ítem vendido contribuyente IMEBA  <br>16 - Ítem Vendido Contribuyente IVA mínimo, Monotributo o Monotributo MIDES. |
        | descripcion | string | "lorem ipsum" |
        | descuento_tipo | string | $ o % |
        | descuento_cantidad | float | Si descuento_tipo es "$", máximo 15 enteros y 2 decimales. Si descuento_tipo es "%", máximo 3 enteros y 3 decimales. |
        | recargo_tipo | string | $ o % |
        | recargo_cantidad | float | Si recargo_tipo es "$", máximo 15 enteros y 2 decimales. Si recargo_tipo es "%", máximo 3 enteros y 3 decimales. |
        | indicador_agente_responsable | string | R - Responsable sobre un producto o servicio vendido  <br>A - Responsable sobre un concepto asociado al producto o servicio vendido  <br>  <br>Debe incluirse cuando el CFE no e-Resguardo incluye Retenciones/Percepciones. |
        | retencionesPercepciones | array de objetos | Ver sección [Retenciones/Percepciones](#retenciones_percepciones) |

        </details>

        ---

        <details>
        <summary>Retenciones/Percepciones</summary>

        Las `retencionesPercepciones` cumplen el rol de `ítems` para los e-Resguardos y también pueden incluirse en el resto de los CFEs, salvo e-Remitos, e-Remitos de Exportación y e-Factura de Exportación (y sus notas de ajuste).

        El valor de la retención será calculado automáticamente como `tasa` / 100 \* `monto_sujeto`.

        | **Clave** | **Valor** | **Detalle** |
        | --- | --- | --- |
        | codigo | integer | Debe corresponder a un [código registrado en la DGI](https://www.efactura.dgi.gub.uy/files/codigos-de-retenciones-percepciones?es), asociado a la retención/percepción/crédito fiscal.  <br>El mismo es formado por el número de formulario y de línea de la Retención/Percepción en DGI. |
        | tasa | float (3 enteros y 3 decimales) |  |
        | monto_sujeto | integer |  |
        | indicador_facturacion | integer | 9 - Ítem a anular en e-Resguardos.  <br>No aplica en caso de que el CFE no sea e-Resguardo o que no se desee anular un e-Resguardo previo. |

        </details>


        ---

        <details>
        <summary>Descuentos y recargos globales</summary>

        | Clave | Valor | Detalle |
        | --- | --- | --- |
        | es_recargo | booleano |  |
        | desc_rec_tipo | string | $ o % |
        | glosa | string (50) | Razón del descuento/recargo |
        | valor | float (2 decimales) | Valor en $ o % |
        | indicador_facturacion | entero | Ver items indicador_facturacion por valores posibles.  <br>Valor debe coincidir con el del ítem o ítems que se desea afectar. |

        </details>

        ---

        <details>
        <summary>Referencia</summary>

        La referencia se usa para asociar comprobantes entre sí.
        Un comprobante puede estar relacionado a uno, varios o ningún comprobante.
        Hay tipos de comprobantes que necesariamente requieren relacionarse con otros: Notas de crédito y débito, por ejemplo.
        En cambio, otros tipos de comprobantes, si quieren omitir el campo de referencia, pueden hacerlo.

        Para asociar comprobantes, existen 3 formas de enviar la información.

        La más sencilla, es enviar el ID del comprobante almacenado en Biller.
        Por ejemplo, si se emitió la e-Factura A-1 y el sistema devolvió el ID 100, al emitir la nota de crédito se puede enviar el siguiente ejemplo para realizar la asociación.

        ``` json
        "referencias": [100]

         ```

        La segunda opción, es brindar el tipo, serie y número del comprobante a asociar, como en el siguiente ejemplo.

        ``` json
        "referencias": [
          {
            "tipo": 111,
            "serie": "A",
            "numero": 1
          }
        ]

         ```

        Por último, se pueden hacer asociaciones a comprobantes que no hayan sido emitidos en Biller.
        Para esto se deberá además especificar la fecha de emisión del comprobante, ya que es necesario enviarlo a la DGI.

        ``` json
        "referencias": [
          {
            "tipo": 111,
            "serie": "A",
            "numero": 1,
            "fecha": "2020-01-01"
          }
        ]

         ```

        En caso de querer asociar a más de 1 comprobante se puede combinar cualquiera de los formatos de asociación.

        ``` json
        "referencias": [
          100,
          {
            "tipo": 111,
            "serie": "A",
            "numero": 2
          }
        ]

         ```

        Además, en caso de que no se quiera asociar específicamente, existe la referencia global. En este tipo de referecia podrás simplemente escribir una referencia y no asociar directamente a determinados comprobantes.

        ``` json
        "referencia_global": 1,
        "razon_referencia": "Referencia global"

         ```

        </details>

        ---

        <details>
        <summary>CAEs especiales</summary>

        En el caso de que la empresa no esté comprendida dentro del régimen general de facturación y utilice CAEs especiales, se deberán agregar dependiendo del tipo de CAE y causal, los siguientes campos:

        ``` json
        "cae": {
            "especial": 1,
            "causal_especial": 1
          }

         ```

        </details>

        ---

        <details>
        <summary>Complemento Fiscal</summary>

        El complemento fiscal se usa para especificar un mandante al momento de emitir un
        comprobante de venta por cuenta ajena.

        | Clave | Valor | Detalle |
        | --- | --- | --- |
        | nombre | string (255) | Nombre del mandante |
        | tipo_documento | entero | 2 - RUT  <br>3 - CI  <br>4 - Otros  <br>5 - Pasaporte  <br>6 - DNI  <br>7 - NIFE |
        | documento | string (255) | Valor del documento del mandante sin puntos ni guiones |
        | pais | string (2) | UY  <br>AR  <br>BR  <br>US  <br>PY  <br>CL  <br>... |


        ``` json
        "complementoFiscal": {
            "nombre": "DA VINCI",
            "tipo_documento": 2,
            "documento": "210980330017",
            "pais": "UY"
          }

         ```

        </details>
