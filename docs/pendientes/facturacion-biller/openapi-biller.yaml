                      direccion: Amézaga 2100
                      ciudad: Montevideo
                      departamento: Montevideo
                      pais: UY
                  referencias:
                  - padre: 39754
                    total: 600
                  pago:
                    fecha: '2021-05-27'
                    monto: 1100
                    referencia: Transferencia BROU 1092
              03-recibo-de-e-ticket-adelanto:
                summary: Recibo de e-Ticket Adelanto
                value:
                  tipo_comprobante: 101
