  /v2/comprobantes/anular:
    post:
      tags:
      - Comprobantes
      summary: Anulación de CFEs
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v2/comprobantes/anular</code>

        Permite la anulación de e-Tickets y e-Facturas que no tengan comprobantes asociados, creando una Nota de Crédito que anule el CFE en su totalidad.

        Retorna la información del comprobante anulador.

        El comprobante puede identificarse por `id` o por la combinación de `tipo_comprobante`, `serie` y `numero`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - fecha_emision_hoy
              properties:
                id:
                  type: integer
                  description: Id del comprobante a anular. Obligatorio si no se envía tipo_comprobante,
                    serie y numero.
                  example: 43573
                tipo_comprobante:
                  type: integer
                  description: Tipo del comprobante a anular. Obligatorio si no se envía id.
                  example: 111
                serie:
                  type: string
                  description: Serie del comprobante a anular. Obligatorio si no se envía id.
                  example: A
                numero:
                  type: integer
                  description: Número del comprobante a anular. Obligatorio si no se envía id.
                  example: 1
                fecha_emision_hoy:
                  type: boolean
                  description: |-
                    - True: la nota de crédito se emite con fecha de hoy.
                    - False: se emite con la fecha del comprobante a anular.
                  example: true
                sucursal:
                  type: integer
                  description: Id de la sucursal emisora del nuevo comprobante. De no enviarse se toma
                    la del comprobante a anular.
                  example: 1
            examples:
              00-anular-con-tipo-comprobante-serie-y-numero:
                summary: Anular con tipo comprobante, serie y número
                value:
                  tipo_comprobante: 111
                  serie: C
                  numero: 4266
                  fecha_emision_hoy: 1
              01-anular-con-id:
                summary: Anular con ID
                value:
                  id: 2
                  fecha_emision_hoy: 0
              02-anular-con-id-y-sucursal:
                summary: Anular con ID y sucursal distinta a la original
                value:
                  id: 2
                  fecha_emision_hoy: 0
                  sucursal: 5
      security:
      - bearerAuth: []
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Anular con tipo comprobante, serie y número
                  value:
                    id: 7
                    tipo_comprobante: 112
                    serie: FD
                    numero: '96708'
                    hash: rNnOkfAj0WLwNNiFTCoOlkrLGRA=
                    fecha_emision: '2024-03-05'
                example-1:
                  summary: Anular con ID
                  value:
                    id: 8
                    tipo_comprobante: 102
                    serie: B
                    numero: '221150'
                    hash: b4iX4ivAwdVMg3TfyObflzvcXys=
                    fecha_emision: '2018-05-07'
          description: OK
  /v2/recibos/crear:
    post:
      tags:
      - Recibos
      summary: Emisión de recibos
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v2/recibos/crear</code>

        Los comprobantes de cobranza o recibos se utilizan para registrar un pago, ya sea de un e-Ticket, una e-Factura o sus correspondientes de Venta por Cuenta Ajena.

        Puede ser emitido por la parcialidad como por la totalidad del monto a pagar. Además, podrá asociarse a más de un comprobante o a ninguno ("Adelanto").

        Si el monto total de las referencias es menor al monto del pago se agregará un ítem en el recibo por la diferencia con el concepto de "Adelanto".

        El recibo debe incluir el receptor (`cliente`) con su documento y dirección. Si no se envía, el endpoint responde `422 cliente required`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - cliente
              - sucursal
              - moneda
              - pago
              properties:
                tipo_comprobante:
                  type: integer
                  description: 'Tipo de CFE del recibo. Ej.: 101 e-Ticket, 111 e-Factura.'
                  example: 111
                forma_pago:
                  type: integer
                  description: |-
                    - 1: Contado
                    - 2: Crédito
                  example: 1
                fecha_emision:
                  type: string
                  description: Fecha de emisión en formato aaaa-mm-dd. Si se omite, se usa la fecha actual.
                  example: '2021-05-27'
                fecha_vencimiento:
                  type: string
                  nullable: true
                  description: Fecha de vencimiento en formato aaaa-mm-dd. Puede ser null.
                  example: null
                sucursal:
                  type: integer
                  description: ID de la sucursal emisora. Se encuentra en Ajustes / Sucursales.
                  example: 204
                moneda:
                  type: string
                  description: Código de moneda (UYU, USD, etc.).
                  example: UYU
                montos_brutos:
                  type: integer
                  description: |-
                    Indica si los montos de las referencias incluyen impuestos.
                    - 0: no incluyen impuestos
                    - 1: incluyen impuestos
                  example: 0
                tasa_cambio:
                  type: number
                  description: Tasa de cambio respecto a la moneda local. Requerida cuando la moneda no
                    es UYU.
                  example: 0
                cliente:
                  type: object
                  description: Receptor del comprobante. Obligatorio.
                  required:
                  - tipo_documento
                  - documento
                  properties:
                    tipo_documento:
                      type: integer
                      description: |-
                        - 2: RUT
                        - 3: CI
                        - 4: Otro
                        - 5: Pasaporte
                        - 6: DNI
                        - 7: NIFE
                      example: 2
                    documento:
                      type: string
                      description: Número de documento sin puntos ni guiones.
                      example: '214987440015'
                    razon_social:
                      type: string
                      description: Nombre principal para tipo_documento 2 (RUT) y 7 (NIFE). Máx. 70 caracteres.
                      example: Arcos Plateados SRL
                    nombre_fantasia:
                      type: string
                      description: Nombre principal para tipo_documento 3 (CI), 5 (Pasaporte) y 6 (DNI).
                        Máx. 30 caracteres.
                      example: McBurguer
                    sucursal:
                      type: object
                      description: Dirección del cliente.
                      properties:
                        direccion:
                          type: string
                          description: Máx. 70 caracteres.
                          example: Amézaga 2100
                        ciudad:
                          type: string
                          description: Máx. 30 caracteres.
                          example: Montevideo
                        departamento:
                          type: string
                          description: Máx. 30 caracteres.
                          example: Montevideo
                        pais:
                          type: string
                          description: Código de país ISO 3166-1 alpha-2.
                          example: UY
                referencias:
                  type: array
                  description: Comprobantes que se están pagando. Se omite (o va vacío) para un adelanto.
                  items:
                    type: object
                    properties:
                      padre:
                        type: integer
                        description: ID del comprobante que se quiere pagar.
                        example: 79508
                      total:
                        type: number
                        description: Monto a pagar de ese comprobante. Debe ser menor o igual al monto
                          del campo pago.
                        example: 1200
                pago:
                  type: object
                  description: Información del pago.
                  required:
                  - fecha
                  - monto
                  properties:
                    fecha:
                      type: string
                      description: Fecha del pago en formato aaaa-mm-dd.
                      example: '2021-05-27'
                    monto:
                      type: number
                      description: Monto total del pago. Debe ser mayor o igual al total de las referencias.
                      example: 1800
                    referencia:
                      type: string
                      description: Información para identificar el pago, NO el comprobante a pagar.
                      example: Transferencia Itaú 2185
                adenda:
                  type: string
                  description: Texto libre agregado al comprobante.
                informacion_adicional:
                  type: string
                  description: Información adicional del comprobante.
                emails_notificacion:
                  type: array
                  description: Emails a los que se enviará el PDF del recibo.
                  items:
                    type: string
                  example:
                  - cliente@empresa.com
            examples:
              00-recibo-de-e-factura:
                summary: Recibo de e-Factura
                value:
                  tipo_comprobante: 111
                  forma_pago: 1
                  fecha_vencimiento: null
                  sucursal: 204
                  moneda: UYU
                  montos_brutos: 0
                  tasa_cambio: 0
                  cliente:
                    tipo_documento: 2
                    documento: '214987440015'
                    razon_social: Arcos Plateados SRL
                    nombre_fantasia: McBurguer
                    sucursal:
                      direccion: Amézaga 2100
                      ciudad: Montevideo
                      departamento: Montevideo
                      pais: UY
                  referencias:
                  - padre: 79508
                    total: 1200
                  - padre: 79509
                    total: 600
                  pago:
                    fecha: '2021-05-27'
                    monto: 1800
                    referencia: Transferencia Itaú 2185
              01-recibo-de-e-ticket:
                summary: Recibo de e-Ticket
                value:
                  tipo_comprobante: 101
                  forma_pago: 1
                  fecha_vencimiento: null
                  sucursal: 303
                  moneda: UYU
                  montos_brutos: 0
                  cliente:
                    tipo_documento: 3
                    documento: '52165030'
                    nombre_fantasia: Juan Pérez
                    sucursal:
                      pais: UY
                      ciudad: Montevideo
                      direccion: Sarandí 420
                  referencias:
                  - padre: 150448
                    total: 1830
                  pago:
                    fecha: '2021-05-27'
                    monto: 1830
                    referencia: Transferencia Itaú 2185
              02-recibo-de-e-factura-con-saldo-sin-asociar:
                summary: Recibo de e-Factura con saldo sin asociar
                value:
                  tipo_comprobante: 111
                  forma_pago: 1
                  fecha_vencimiento: null
                  sucursal: 102
                  moneda: UYU
                  montos_brutos: 0
                  tasa_cambio: 0
                  cliente:
                    tipo_documento: 2
