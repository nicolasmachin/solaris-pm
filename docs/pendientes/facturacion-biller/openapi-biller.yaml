  /v2/pagos/crear:
    post:
      tags:
      - Pagos
      summary: Registro de pagos
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v2/pagos/crear</code>

        Permite registrar un pago y asociarlo a uno o más comprobantes emitidos por la empresa autenticada.

        El monto total del pago debe coincidir con la suma de los montos asociados. Los comprobantes deben pertenecer a la empresa, ser del mismo cliente, tener la misma moneda y ser del mismo tipo.

        También se pueden registrar montos negativos para revertir un pago anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fecha
              - monto
              - referencia
              - comprobantes
              properties:
                fecha:
                  type: string
                  description: Fecha del pago en formato aaaa-mm-dd o dd/mm/aaaa.
                  example: '2026-05-28'
                monto:
                  type: number
                  description: Monto total del pago. Debe coincidir con la suma de los montos de los comprobantes
                    asociados.
                  example: 1500
                referencia:
                  type: string
                  description: Información para identificar el pago. Máx. 255 caracteres.
                  example: Transferencia BROU 12345
                comprobantes:
                  type: array
                  minItems: 1
                  description: Comprobantes a los que se asigna el pago.
                  items:
                    type: object
                    required:
                    - id
                    - monto
                    properties:
                      id:
                        type: integer
                        description: ID del comprobante al que se asigna el pago.
                        example: 79508
                      monto:
                        type: number
                        description: Monto que se asigna a ese comprobante. No puede superar su saldo
                          pendiente.
                        example: 1000
            examples:
              example-0:
                summary: Pago de varios comprobantes
                value:
                  fecha: '2026-05-28'
                  monto: 1500
                  referencia: Transferencia BROU 12345
                  comprobantes:
                  - id: 79508
                    monto: 1000
                  - id: 79509
                    monto: 500
      security:
      - bearerAuth: []
      responses:
        '201':
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID del pago creado.
                    example: 302968
              example:
                id: 302968
          description: Created
  /v2/clientes/crear:
    post:
      tags:
      - Clientes
      summary: Creación de clientes
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v2/clientes/crear</code>

        Permite la creación de clientes sin la necesidad de emitir un comprobante.
        En el caso de emitir desde biller.uy podrán autocompletar la información en los comprobantes con la cargada.

        Lleva los mismos campos que el objeto `cliente` y `sucursal` de emisión de CFEs, pero en un único objeto plano.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - tipo_documento
              - documento
              - pais
              properties:
                razon_social:
                  type: string
                  description: Nombre principal para clientes con tipo_documento 2 (RUT) y 7 (NIFE). Máx.
                    70 caracteres.
                  example: DA VINCI SRL
                nombre_fantasia:
                  type: string
                  description: Nombre principal para clientes con tipo_documento 3 (CI), 5 (Pasaporte)
                    y 6 (DNI). Máx. 30 caracteres.
                  example: Da Vinci
                tipo_documento:
                  type: integer
                  description: |-
                    - 2: RUT
