openapi: 3.0.0
info:
  title: Biller API Doc
  description: |-
    # Introducción

    ¡Bienvenido a la API de Biller!

    Mediante la API vas a poder emitir comprobantes y obtener los PDFs de los comprobantes emitidos.
  version: 1.0.0
servers:
- url: https://test.biller.uy
  description: Testing
- url: https://biller.uy
  description: Producción
security:
- bearerAuth: []
