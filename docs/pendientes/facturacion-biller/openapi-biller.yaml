  /v2/productos/cargar:
    post:
      tags:
      - Productos
      summary: Creación de productos y servicios
      description: |-
        <span style="color:#00b96b;font-weight:600;font-family:monospace">POST</span> <code>/v2/productos/cargar</code>

        Permite la creación de productos y servicios sin la necesidad de emitir un comprobante.
        En el caso de emitir desde biller.uy podrán autocompletar la información en los comprobantes con la cargada.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - codigo
              - nombre
              - precio
              - moneda
              - indicador_facturacion
              - es_servicio
              properties:
                codigo:
                  type: string
                  description: Código del producto. Máximo 35 caracteres.
                  example: PROD-001
                nombre:
                  type: string
                  description: Nombre del producto o servicio. Máximo 80 caracteres.
                  example: Silla de oficina
                descripcion:
                  type: string
                  description: Descripción adicional del producto o servicio.
                  example: Silla ergonómica con ruedas
                precio:
                  type: number
                  description: Precio unitario con hasta 6 decimales.
                  example: 1500.0
                moneda:
                  type: string
                  description: Moneda del precio (UYU, USD, etc.).
                  example: UYU
                unidad_medida:
                  type: string
                  description: Unidad de medida. Máximo 4 caracteres.
                  example: UNI
                indicador_facturacion:
                  type: integer
                  description: |-
                    - 1: Exento de IVA
                    - 2: Tasa mínima
                    - 3: Tasa básica
                    - 4: Otra tasa (requiere `impuesto_tasa`)
                    - 5: Entrega gratuita
                    - 6: Producto o servicio no facturable
                    - 7: Producto o servicio no facturable negativo
                    - 8: Ítem a rebajar en e-remitos
                    - 9: Ítem a anular en resguardos
                    - 10: Exportación y asimiladas
                    - 11: Impuesto percibido
                    - 12: IVA en suspenso
                    - 13: Ítem vendido no contribuyente
                    - 14: Ítem vendido contribuyente monotributo
                    - 15: Ítem vendido contribuyente IMEBA
                    - 16: Ítem vendido contribuyente IVA mínimo, Monotributo o Monotributo MIDES
                  example: 3
                impuesto_tasa:
                  type: number
                  description: Obligatorio cuando `indicador_facturacion` es 4 (Otra tasa). Tasa de IVA
                    a aplicar.
                  example: 10.5
                inventario:
                  type: number
                  description: Cantidad de stock existente. Si el producto ya existe, sobreescribe el
                    valor. Admite decimales.
                  example: 100.0
                es_servicio:
                  type: boolean
                  description: |-
                    - True: es un servicio, no usa stock.
                    - False: es un producto, se hace seguimiento de stock con las ventas.
                  example: false
            examples:
              00-creacion-de-producto:
                summary: Creación de producto
                value:
                  codigo: CAM 01
                  nombre: Camiseta 01
                  descripcion: Camiseta azul talles de S a L
                  moneda: UYU
                  precio: '599'
                  indicador_facturacion: 1
                  inventario: '5'
                  es_servicio: false
              01-creacion-de-servicio:
                summary: Creación de servicio
                value:
                  codigo: LMP SLLN
                  nombre: Limpieza de sillón
                  descripcion: Limpieza profunda de mueble
                  moneda: UYU
                  precio: '1300'
                  indicador_facturacion: 1
                  es_servicio: true
      security:
      - bearerAuth: []
      responses:
        '201':
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Creación de producto
                  value:
                    id: 67926
                example-1:
                  summary: Creación de servicio
                  value:
                    id: 68012
          description: Created
  /v2/comprobantes/obtener:
    get:
      tags:
      - Comprobantes
      summary: Obtener
      description: |-
        <span style="color:#0082d0;font-weight:600;font-family:monospace">GET</span> <code>/v2/comprobantes/obtener</code>

        Devuelve información de todos los comprobantes emitidos o recibidos que cumplan con los criterios detallados en la solicitud.

        Para identificar comprobantes de cobranza, habrá un campo `indicador_cobranza_propia` que estará en 1 cuando el comprobante obtenido sea un recibo.

        Ninguno de los campos es obligatorio, pero si `id` no está definido y `desde` tampoco, se tomará como `desde` la fecha de hoy a las 00:00:00.

        **Obtener información de ítems**

        Puede obtenerse información acerca de los `items` de un comprobante siempre y cuando el parámetro `id` en el llamado esté definido. Lo mismo aplica para las `retenciones_percepciones` en el caso de los e-Resguardos.

        **Obtener comprobantes recibidos**

        Este llamado devuelve todos los comprobantes emitidos a la empresa y que fueron enviados vía mail a la casilla que la empresa tiene publicada en DGI. En este caso, se agrega un parámetro `recibidos` a la url como se muestra en el ejemplo.
      security:
      - bearerAuth: []
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: id
        in: query
        schema:
          type: string
        description: ID del CFE
        example: '53616'
      - name: sucursal
        in: query
        schema:
          type: string
        description: Sucursal emisora
        example: '6'
      - name: desde
        in: query
        schema:
          type: string
        description: Fecha creación desde en formato aaaa-mm-dd hh:mm:ss
        example: '2019-10-01 00:00:00'
      - name: hasta
        in: query
        schema:
          type: string
        description: Fecha creación hasta en formato aaaa-mm-dd hh:mm:ss
        example: '2019-11-01 00:00:00'
      - name: tipo_comprobante
        in: query
        schema:
          type: string
        description: Revisar "Tabla de Valores". De querer utilizarse es obligatorio incluir serie y numero
        example: '101'
      - name: serie
        in: query
        schema:
          type: string
        description: De querer utilizarse es obligatorio incluir tipo_comprobante y numero
        example: L
      - name: numero
        in: query
        schema:
          type: string
        description: Número del comprobante ante DGI. De querer utilizarse es obligatorio incluir serie
          y tipo_comprobante
        example: '479177'
      - name: numero_interno
        in: query
        schema:
          type: string
        description: Identificador propio de la empresa para el comprobante, pueden ser letras y números,
          debe ser único
        example: AB1997
      - name: recibidos
        in: query
        schema:
          type: string
        description: Por defecto false
        example: '1'
      responses:
        '200':
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: array
              example:
              - id: 53616
                tipo_comprobante: 101
                serie: C
                numero: 2069514
                moneda: UYU
                indicador_cobranza_propia: 0
                tot_iva_tasa_min: 0
                tot_iva_tasa_bas: 44
                tot_iva_tasa_otra: null
                descuentosRecargos: null
                total: 244
                cliente: []
                esNotaAjuste: false
                fecha_creacion: '2019-10-15 15:10:39'
                fecha_emision: '2019-10-15'
                fecha_vencimiento: '2019-10-30'
                cae:
                  numero: '76747726'
                  serie: C
                  inicio: 1
                  fin: 1000000
                  fecha_expiracion: '2021-10-15'
          description: OK
