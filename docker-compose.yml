services:
  postgres:
    image: postgres:15-alpine
    container_name: voltia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltia
      POSTGRES_PASSWORD: voltia_dev_password
      POSTGRES_DB: voltia_pm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltia -d voltia_pm"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voltia-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://voltia:voltia_dev_password@postgres:5432/voltia_pm
      # Usuario solo-lectura para el AI assistant (Text-to-SQL).
      # Tablas sensibles (audit_logs, ai_queries, etc.) están REVOKE-eadas.
      DATABASE_URL_READONLY: postgresql://voltia_readonly:voltia_readonly_2026@postgres:5432/voltia_pm
      # API key del modelo Claude (Anthropic). Se lee del .env del host
      # (raíz del repo) — agregar `ANTHROPIC_API_KEY=sk-ant-...` ahí.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: dev-secret-cambiar-en-produccion
      JWT_EXPIRES_IN: 7d
      STORAGE_PATH: /app/storage
      MAX_FILE_SIZE_MB: 20
      BASE_URL: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - voltia_storage:/app/storage

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voltia-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
  voltia_storage:
