services:
  postgres:
    image: postgres:15-alpine
    container_name: voltia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No exponemos el puerto 5432 al host: solo los otros contenedores lo ven

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voltia-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      STORAGE_PATH: ${STORAGE_PATH}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      BASE_URL: ${BASE_URL}
      # SMTP (correo) — sin estas, sendEmail corta con "SMTP no configurado" y no
      # salen los mails internos (traspasos, avisos, etc.). Ver DEPLOY.md §2.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:-}
      # IA (Claude) y transcripción de audios (Whisper).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - voltia_storage:/app/storage
    ports:
      - "127.0.0.1:4000:4000" 
    # No exponemos el puerto al host: Caddy va a proxear internamente

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voltia-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: ${BASE_URL}
    ports:
      - "127.0.0.1:5173:5173"
    # No exponemos el puerto al host: Caddy va a proxear internamente

volumes:
  postgres_data:
  voltia_storage:
