services:
  postgres:
    image: postgres:15-alpine
    container_name: voltia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No exponemos el puerto 5432 al host: solo los otros contenedores lo ven

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voltia-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Default a production si el .env de prod no lo define: evita que la
      # redirección de mails de dev (y otros comportamientos gateados por
      # NODE_ENV, como el guard del seed) queden activos por un env incompleto.
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      STORAGE_PATH: ${STORAGE_PATH}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      # Límite aparte para videos de ensayos: son órdenes de magnitud más pesados
      # que el resto de los adjuntos, y el límite alto se aplica SOLO en esa ruta
      # (no sube el techo global de MAX_FILE_SIZE_MB).
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-500}
      BASE_URL: ${BASE_URL}
      # SMTP (correo) — sin estas, sendEmail corta con "SMTP no configurado" y no
      # salen los mails internos (traspasos, avisos, etc.). Ver DEPLOY.md §2.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:-}
      # IA (Claude) y transcripción de audios (Whisper).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Growatt Open API. Sin el token, la ingesta mensual de reportes
      # fotovoltaicos y el monitoreo diario de plantas fallan con
      # GROWATT_NOT_CONFIGURED en cada planta.
      GROWATT_API_TOKEN: ${GROWATT_API_TOKEN:-}
      # Cuenta propia de Growatt. El token alcanza también plantas de otra
      # empresa instaladora (87 de las 152 visibles); con esto sólo se traen y
      # se guardan las nuestras, y no se gastan llamadas en las ajenas.
      GROWATT_USER_ID: ${GROWATT_USER_ID:-}
      GROWATT_API_BASE: ${GROWATT_API_BASE:-}
      REPORTES_FV_GROWATT_PAUSA_MS: ${REPORTES_FV_GROWATT_PAUSA_MS:-}
      REPORTES_FV_GROWATT_CONCURRENCIA: ${REPORTES_FV_GROWATT_CONCURRENCIA:-}
      # Monitoreo diario de plantas. El digest sale prendido, a la casilla de
      # FV_MONITOR_EMAIL (default nmachin@voltia.com.uy). Si algún día genera
      # ruido, FV_MONITOR_EMAIL_ENABLED=false lo apaga sin frenar el monitoreo.
      FV_MONITOR_ENABLED: ${FV_MONITOR_ENABLED:-}
      FV_MONITOR_EMAIL: ${FV_MONITOR_EMAIL:-}
      FV_MONITOR_EMAIL_ENABLED: ${FV_MONITOR_EMAIL_ENABLED:-}
      CRON_FV_MONITOR: ${CRON_FV_MONITOR:-}
      FV_MONITOR_CONCURRENCIA: ${FV_MONITOR_CONCURRENCIA:-}
      FV_MONITOR_DIAS: ${FV_MONITOR_DIAS:-}
      FV_MONITOR_KWH_MIN: ${FV_MONITOR_KWH_MIN:-}
      FV_MONITOR_HORAS_SIN_COMS: ${FV_MONITOR_HORAS_SIN_COMS:-}
      # Conector MCP (Voltia PM dentro del chat de Claude).
      #
      # MCP_PUBLIC_URL tiene que coincidir EXACTO con la dirección que se tipea
      # al agregar el conector, sin barra final: se publica en el documento de
      # descubrimiento y Claude compara los dos strings. Si difieren, la
      # conexión falla sin un error que lo explique.
      #
      # MCP_ALLOWED_EMAILS es la lista de habilitados. Vacía deshabilita el
      # conector entero, que es el default deseado: tener usuario en la app no
      # alcanza para exponer los datos por fuera de ella.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ALLOWED_EMAILS: ${MCP_ALLOWED_EMAILS:-}
    volumes:
      - voltia_storage:/app/storage
    ports:
      - "127.0.0.1:4000:4000" 
    # No exponemos el puerto al host: Caddy va a proxear internamente

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voltia-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: ${BASE_URL}
    ports:
      - "127.0.0.1:5173:5173"
    # No exponemos el puerto al host: Caddy va a proxear internamente

  # Respaldo off-site del storage (Roadmap infra, Fase 5).
  #
  # `voltia_storage` guarda uploads de usuario que NO se pueden regenerar: fotos
  # de obra, videos de ensayos, documentación firmada. Los PDFs generados por las
  # herramientas sí se pueden re-emitir desde su snapshot, pero un upload perdido
  # se perdió. Sin este servicio, todo eso vive en un solo disco sin copia.
  #
  # Sincroniza cada 6 h contra Backblaze B2. Monta el volumen en :ro — el backup
  # nunca escribe sobre el storage.
  backup:
    image: rclone/rclone:latest
    container_name: voltia-backup
    restart: unless-stopped
    volumes:
      - voltia_storage:/data:ro
    environment:
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_ACCOUNT_ID:-}
      RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-voltia-storage}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${RCLONE_CONFIG_B2_ACCOUNT}" ] || [ -z "$${RCLONE_CONFIG_B2_KEY}" ]; then
          echo "[backup] B2_ACCOUNT_ID / B2_APPLICATION_KEY sin configurar: el respaldo del storage NO está corriendo."
          echo "[backup] Ver docs/DEPLOY.md sección 'Respaldo off-site del storage'."
          # Dormir en vez de salir: un exit dejaría al contenedor en crash-loop y
          # ensuciaría los logs del deploy sin aportar nada.
          while true; do sleep 3600; done
        fi
        while true; do
          echo "[backup] sync -> b2:$${B2_BUCKET}"
          # --backup-dir es OBLIGATORIO: sin él, un archivo borrado localmente se
          # borra también en B2, y el respaldo replicaría fielmente la pérdida de
          # evidencia en lugar de protegerla. Con él, los borrados se archivan por
          # fecha en un bucket aparte y se pueden recuperar.
          rclone sync /data "b2:$${B2_BUCKET}" \
            --backup-dir "b2:$${B2_BUCKET}-deleted/$$(date +%F)" \
            --exclude '**/.tmp/**' \
            --transfers 2 --checkers 4 \
            --bwlimit 5M \
            --log-level INFO \
            || echo "[backup] sync falló (reintenta en el próximo ciclo)"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  postgres_data:
  voltia_storage:
